name: Regenerate CSS On Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  regenerate-css:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove generated block CSS
        run: |
          find ./blocks -type f -name '*.css' ! -name '*.tw.css' -delete
          rm -f ./styles/global.css

      - name: Rebuild generated CSS
        run: npm run build

      - name: Lint project
        run: npm run lint

      - name: Commit regenerated CSS
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f blocks/**/*.css styles/global.css

          if git diff --cached --quiet; then
            echo "No regenerated CSS changes to commit."
            exit 0
          fi

          git commit -m "chore(dev): regenerate generated css"
          git push

name: Clean Generated CSS On Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: dev-clean-generated-css
  cancel-in-progress: true

jobs:
  clean-generated-css:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove generated CSS
        run: |
          find ./blocks -type f -name '*.css' ! -name '*.tw.css' -delete
          rm -f ./styles/global.css

      - name: Commit CSS cleanup to dev
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u blocks styles

          if git diff --cached --quiet; then
            echo "No generated CSS files to remove."
            exit 0
          fi

          git commit -m "chore(dev): remove generated CSS"
          git push

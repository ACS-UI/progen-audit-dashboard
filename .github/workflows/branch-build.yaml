name: Branch Build

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

concurrency:
  group: branch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-generated-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove generated CSS
        run: |
          find ./blocks -type f -name '*.css' ! -name '*.tw.css' -delete
          rm -f ./styles/global.css

      - name: Build project
        run: npm run build

      - name: Upload generated CSS artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-css-${{ github.ref_name }}
          path: |
            blocks/**/*.css
            styles/global.css
          if-no-files-found: error

      - name: Commit generated CSS to source branch
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find ./blocks -type f -name '*.css' ! -name '*.tw.css' -exec git add -f {} +
          git add -f styles/global.css

          if git diff --cached --quiet; then
            echo "No generated CSS changes to commit."
            exit 0
          fi

          git commit -m "chore(css): generate CSS for ${{ github.ref_name }}"
          git push
